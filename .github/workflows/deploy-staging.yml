name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "806997204926"
  ECR_REPOSITORY: ecommerce-staging
  ECS_CLUSTER: ecommerce-staging
  ECS_SERVICE: ecommerce-staging
  ECS_TASK_FAMILY: ecommerce-staging
  CONTAINER_NAME: app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::806997204926:role/ecommerce-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.uri }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.uri }}"

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify staging health
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ecommerce-staging \
            --region "$AWS_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "Staging ALB: http://${ALB_DNS}"

          for i in {1..12}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "http://${ALB_DNS}/health" || true)

            echo "Health check attempt ${i}: HTTP ${STATUS}"

            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed."
              exit 0
            fi

            sleep 5
          done

          echo "Staging health check failed."
          exit 1
